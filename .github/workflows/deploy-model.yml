name: Deploy Vision Moderation Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SHA:   ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Install Spectral (OpenAPI linter)
        run: npm install -g @stoplight/spectral-cli@6

      - name: Lint OpenAPI spec
        run: spectral lint openapi.yaml --ruleset .spectral.yaml

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        run: bash ./scripts/test-unit.sh

      - name: Contract tests
        run: bash ./scripts/test-contract.sh

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  push:
    name: Push Image
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ env.SHA }}

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ env.SHA }}
          DEPLOY_ENV: staging
        run: bash ./scripts/deploy.sh

  smoke-staging:
    name: Smoke Test → Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests against staging
        env:
          IMAGE_TAG: ${{ env.SHA }}
          DEPLOY_ENV: staging
        run: bash ./scripts/smoke.sh

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: smoke-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canary rollout – 10%
        env:
          IMAGE_TAG: ${{ env.SHA }}
          DEPLOY_ENV: production
          CANARY_WEIGHT: "10"
        run: bash ./scripts/deploy.sh

      - name: Verify canary health
        env:
          IMAGE_TAG: ${{ env.SHA }}
          DEPLOY_ENV: production
          CANARY_WEIGHT: "10"
        run: bash ./scripts/canary-verify.sh

      - name: Full rollout – 100%
        env:
          IMAGE_TAG: ${{ env.SHA }}
          DEPLOY_ENV: production
          CANARY_WEIGHT: "100"
        run: bash ./scripts/deploy.sh
